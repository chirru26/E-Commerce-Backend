spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ecommerce-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ecommerce-backend
              uri: ${BACKEND_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
          metrics:
            enabled: true

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
