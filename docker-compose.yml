services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ecommerce-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ecommerce-redisinsight
    restart: unless-stopped
    ports: ["5540:5540"]
    depends_on:
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports: ["1025:1025","8025:8025"]

  backend:
    build: {context: ., dockerfile: Dockerfile}
    container_name: ecommerce-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  gateway:
    build: {context: ./gateway, dockerfile: Dockerfile}
    container_name: ecommerce-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: 8080
      BACKEND_URL: http://backend:8081
    ports: ["8080:8080"]
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
